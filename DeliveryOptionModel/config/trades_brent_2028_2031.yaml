# ---------------------------------------------------------------------------
# trades_brent_2028_2031.yaml - one M / M+1 CSO for every M from Jan-2028 to
# Nov-2031 (47 trades), selling on Brent instead of HH.
#
# Margin per natural delivery month m (USD/MMBtu):
#   X_m = (w_m * Brent_m + 1.5) - TTF_m
#   w_m = 0.166 for 2028 months, 0.132 for 2029-2031 months
# Brent_m is the ICE Brent contract m+2 (the prompt during month m); see
# contract_month_offset in market.yaml. Each CSO carries its own two months'
# weights [w_M, w_M1]: Dec-28/Jan-29 is 0.166 vs 0.132.
#
# Leg form (any hub in market.yaml's registry, weight / constant scalar or
# [M, M+1]):   sell: {underlying: Brent, weight: 0.166, constant: 1.5}
#
#   python calibrate.py --trades config/trades_brent_2028_2031.yaml
#   python price.py     --trades config/trades_brent_2028_2031.yaml
# ---------------------------------------------------------------------------

defaults:
  volume_mmbtu: 3600000
  buy:  {underlying: TTF, weight: 1.0}
  can_cancel: false
  decision_date: null            # earliest fixing of M's legs (TTF: end of M-1)
  pay_lag_days: 20

trades:
  - {id: BRT_Jan28_Feb28, months: ["2028-01", "2028-02"], sell: {underlying: Brent, weight: 0.166, constant: 1.5}}
