# ---------------------------------------------------------------------------
# trades_2028_2031.yaml - one M / M+1 CSO for every M from Jan-2028 to
# Nov-2031 (47 trades; the last pair is Nov/Dec-2031).
#
# Margin per natural delivery month m (USD/MMBtu):
#   X_m = 1.15 * HH_m + K_m - TTF_m
#   K_m = 9.89 for 2028 months, 6.66 for 2029-2031 months
# Each CSO carries the strikes of its own two months, [K_M, K_M1]. Where they
# are equal the strike cancels out of the option; in Dec-28/Jan-29 they differ
# (9.89 vs 6.66) and the gap enters the switch decision.
#
#   python calibrate.py --trades config/trades_2028_2031.yaml
#   (keep the near strip: HH has no listed vol past Apr-27, so the filled far
#    HH vols are scaled to the strip's liquid months)
#   python price.py     --trades config/trades_2028_2031.yaml
# ---------------------------------------------------------------------------

defaults:
  volume_mmbtu: 3600000
  sell: {hub: HH, slope: 1.15}
  buy:  {hub: TTF, slope: 1.0}
  can_cancel: false
  decision_date: null            # earliest fixing of M's legs
  pay_lag_days: 20

trades:
  - {id: CSO_Jan28_Feb28, months: ["2028-01", "2028-02"], strike_usd_mmbtu: [9.89, 9.89]}
