# ---------------------------------------------------------------------------
# regions.yaml - the geography, and how it is weighted into a single number.
#
# An unweighted mean temperature over a country is not a demand signal. Gas
# degree days are weighted by where the gas is BURNED; crop weather is weighted
# by where the crop is GROWN. Everything here is that weighting.
#
# PROVENANCE. Every region carries `provenance`. `estimate` means the weights
# were set from published production or population shares to the nearest
# percent and have NOT been reconciled against a desk source. They are good
# enough to build and test the pipeline on and are not good enough to trade a
# real position on. `wxreturns audit-weights` lists every estimate so they can
# be replaced deliberately rather than forgotten.
#
# For the EU gas set specifically, the repo already holds the right source:
# 20260825-EuropeLocalDistributionZoneGasDemandMonitor.xlsx. Those LDZ shares
# supersede the estimates below once extracted.
#
# Weights need not sum to exactly 1: the loader normalises and a test asserts
# it. They are written close to 1 so a typo is visible by eye.
# ---------------------------------------------------------------------------

regions:

  # =========================================================================
  # NATURAL GAS - demand-weighted temperature composites
  # =========================================================================

  us_gas:
    label: "US lower-48 gas-weighted composite"
    kind: "gas"
    provenance: "estimate"          # metro population shares, nearest 0.1%
    # Population weighting is the industry convention and is what NOAA's own
    # population-weighted degree days use. True GAS weighting tilts further
    # north, because Houston burns little gas for heat and Chicago burns a
    # great deal. Swapping in EIA residential consumption by state is the
    # obvious upgrade and would move the composite colder in winter.
    notes: >
      Sensitivity to this weighting is a required Phase 2 output. If the signal
      only exists under one weighting scheme it is not a signal.
    points:
      - {name: "New York",      lat: 40.71,  lon: -74.01,   weight: 0.100}
