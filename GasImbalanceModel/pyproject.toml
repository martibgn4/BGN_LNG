[project]
name = "gasbalance"
version = "0.1.0"
description = "European gas supply-demand balance model (NW Europe first cut)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "typer>=0.12",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Bloomberg is the storage source for this model.
#
# xbbg is PINNED to the 0.12.x line on purpose. xbbg 1.x returns polars frames,
# which silently breaks every pandas idiom here (and in the wider BGN_LNG repo):
# `.empty` raises AttributeError rather than failing a check. 0.12.2 is also the
# version the rest of this trader's codebase runs.
#
# blpapi is NOT on PyPI. Install it from Bloomberg's own index, and note it
# needs a logged-in Terminal on the same machine:
#   uv pip install --index-url=https://blpapi.bloomberg.com/repository/releases/python/simple/ blpapi
bloomberg = ["xbbg==0.12.2"]

[project.scripts]
gasbalance = "gasbalance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasbalance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
