[project]
name = "ttf_forecaster"
version = "0.1.0"
description = "Research platform for forecasting Dutch TTF gas prices and returns against the forward curve"
requires-python = ">=3.11"
# Lower bounds only: the research env (..\env_local, see docs/environment_audit.md) is the
# reference. Pin a lockfile at productionisation (modelling_log D-002).
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.0"]
boosting_extra = ["xgboost>=2.0", "catboost>=1.2"]          # not installed (D-005)
regimes = ["hmmlearn>=0.3"]                                # not installed (D-005)
bloomberg = ["xbbg==0.10.3"]                               # blpapi comes from Bloomberg's own index
spark = ["requests>=2.31"]
text = ["jsonschema>=4.0"]                                # installed in env_local
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
ttf-forecaster = "ttf_forecaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttf_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "live: requires vendor access; never run in CI or by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD", "NPY", "DTZ"]
ignore = ["PD901"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
