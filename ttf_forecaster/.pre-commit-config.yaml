# pre-commit hooks for ttf_forecaster (owner: software-quality-agent).
#
# CONFIG ONLY - nothing is installed by this file. ruff, mypy and pre-commit are listed in the `dev`
# extra of pyproject.toml but are NOT installed in ..\env_local (docs/environment_audit.md). To use:
#     pip install -e .[dev]          # only with the user's approval (CLAUDE.md: no silent installs)
#     pre-commit install
#     pre-commit run --all-files
#
# This project lives inside the parent BGN_LNG repository (the Git root is one level up), so every
# hook is scoped to `^ttf_forecaster/` and the local hooks `cd` into it. If the project is ever
# split into its own repository, drop the `ttf_forecaster/` prefixes.
#
# ruff and mypy run as `language: system` local hooks so they use the same interpreter and pinned
# versions as the research environment (no second, drifting toolchain). Their settings come from
# [tool.ruff] / [tool.mypy] in pyproject.toml (line-length 100, target py311, strict defs).

default_language_version:
  python: python3

# NOTE: pre-commit reads .pre-commit-config.yaml from the Git root (BGN_LNG/). Until this file is
# referenced from there, run it explicitly from the repo root:
#     pre-commit run -c ttf_forecaster/.pre-commit-config.yaml --all-files
# No global `exclude` on data/: the block-data-files hook below must still see those paths.
files: ^ttf_forecaster/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]                     # licensed extracts must never be committed
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: bash -c 'cd ttf_forecaster && python -m ruff check --force-exclude "${@#ttf_forecaster/}"' --
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format check)
        entry: bash -c 'cd ttf_forecaster && python -m ruff format --check --force-exclude "${@#ttf_forecaster/}"' --
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (src only)
        entry: bash -c 'cd ttf_forecaster && python -m mypy src/ttf_forecaster'
        language: system
        files: ^ttf_forecaster/src/.*\.py$
        pass_filenames: false
        require_serial: true

      # ---- data / secrets guards (pure pre-commit, no tool needed) ----------------------------
      - id: block-data-files
        name: block files under data/ (licensed / regenerated; .gitkeep allowed)
        entry: "Files under ttf_forecaster/data/ must not be committed (licensed data; see .gitignore)"
        language: fail
        files: ^ttf_forecaster/data/
        exclude: ^ttf_forecaster/data/\.gitkeep$

      - id: block-credential-files
        name: block *credentials* / .env / *.secret files
        entry: "Credential files must never be committed (secrets come from env / .env via settings.get_secret)"
        language: fail
        files: (?i)(credentials|(^|/)\.env($|\.)|\.secret$|\.pem$|\.key$)
        exclude: (?i)\.env\.example$

      - id: block-data-artefacts
        name: block parquet / feather / duckdb artefacts anywhere
        entry: "Data artefacts (.parquet/.feather/.duckdb) are regenerated by the pipeline, never committed"
        language: fail
        files: \.(parquet|feather|duckdb)$

      - id: block-local-configs
        name: block git-ignored local config overrides (may carry live authorisation)
        entry: "configs/local*.yaml is machine-specific (live_calls_authorised, paths) and git-ignored"
        language: fail
        files: ^ttf_forecaster/configs/local[^/]*\.ya?ml$

      - id: no-absolute-user-paths
        name: no absolute C:\Users / C:\Marti paths in code or configs
        entry: '(?i)\b[A-Za-z]:[\\/]+(Users|Marti)\b'
        language: pygrep
        files: ^ttf_forecaster/(src|configs|scripts)/
