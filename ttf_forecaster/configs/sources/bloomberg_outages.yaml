# Bloomberg BSRCH power-plant unavailability, ASSET_OUTAGE:POWER_PLANT (D-043). Read by data/outages.py only.
#
# PROVENANCE: BSRCH domain ASSET_OUTAGE:POWER_PLANT, supplied by the user as an Excel form
# (=@BSRCH("ASSET_OUTAGE:POWER_PLANT", "LOCATION=..", "START_DATE=..", "END_DATE=..", "AS_OF_DATE=..", "STACK=FALSE")).
# Verified through the Python API (xbbg blp.bsrch) on 2026-10-19: FR, DE and NORDPOOL return data; other locations 0 rows.
#
# Values are unavailable MW per fuel per applicable day. One as-of date gives the forward plan to 2028-12-31.
# AS_OF_DATE is honoured back to 2026-10-13 only, so vintages exist from that date. START_DATE is a rolling year
# before the as-of date. There is no ticker: ticker and field are null, so the ticker adapter refuses these series.
#
# PIT: snapshot rows (applicable day >= as-of) are FORECAST rows with issue = publication = the request time
# (conservative). Realised rows (applicable day < as-of) are OBSERVATION rows, grade B, D+1 12:00 UTC.
# Units MW are as BSRCH returns them (measured).

series:
  power.fr.outage_biomass_unavail_mw:
    vendor: bloomberg_bsrch
    ticker: null
    field: null
    unit: MW
    frequency: daily
    geography: FR
    status: known
    pit_grade: B
    publication_lag: {days: 1, time: "12:00", tz: UTC, business_days: false}
