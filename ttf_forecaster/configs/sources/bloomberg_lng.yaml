# Bloomberg LNG aggregates (owner: lng-flows-agent). Served by the market-data agent's Bloomberg
# adapter (data/bloomberg.py), which reads EVERY configs/sources/bloomberg*.yaml file.
#
# PROVENANCE. All tickers below: "desk notes (Bloomberg //blp/instruments discovery), verified
# 2026-09-17", cross-checked against LNGFreightModel/config/sources.yaml, where every ticker was
# executed live on 2026-09-17 with field px_last and the payload inspected (row counts and first
# dates recorded there). AHOYIMEU / AHOYIMNA are taken from that same verified block. Nothing here
# was executed from this project.
#
# PIT. Revision behaviour of the LNGG*/AHOY* aggregates is UNKNOWN (Bloomberg history holds the
# latest value only) -> pit_grade B everywhere, publication_time from the lag rule below,
# publication_time_estimated = true. LNGFreightModel measured on 2026-09-17 that on-water / flow
# series had printed D-1 and transits D-2 at probe time; the intraday release time is unknown, so
# the rule makes the value usable only from the NEXT TTF settlement after that day (23:00 local),
# i.e. on-water value for day D first enters the 19:00 origin of D+2. Sensitivity: days 1 time
# 07:00 (optimistic), days 3 (pessimistic). To be replaced by measured live snapshotting.
#
# DATA HANDLING NOTES (drive features/lng.py):
#   * LNGGTR* transit counts are small integers, often zero  -> rolling sums / shares only.
#   * AHOY* individual legs are cargo-level and mostly zero (AHOYAMSA zero on 72% of days per
#     LNGFreightModel) -> rolling sums / shares only; pct-change off zero is infinite. Never use a
#     raw daily leg value.
#   * IKA1/IKD1/IKI1 are GENERIC 1st futures that roll monthly: levels or roll-masked returns only.
#     Roll steps are most of their large moves (LNGFreightModel README).

vendor: bloomberg
entitlement: licensed_bloomberg
provenance_default: "desk notes (Bloomberg //blp/instruments discovery), verified 2026-09-17; LNGFreightModel/config/sources.yaml (px_last, live 2026-09-17)"

lag_rules:
  lng_daily: &lag_lng_daily {days: 1, time: "23:00", tz: "Europe/Amsterdam", business_days: false}
  lng_transits: &lag_lng_transits {days: 2, time: "23:00", tz: "Europe/Amsterdam", business_days: false}
  # Baltic LNG futures settle in London after the TTF settlement window -> next European trading
  # date 19:00 (PIT policy section 4, cross-commodity rule).
  freight_futures: &lag_freight_fut {days: 1, time: "19:00", tz: "Europe/Amsterdam", business_days: true}

