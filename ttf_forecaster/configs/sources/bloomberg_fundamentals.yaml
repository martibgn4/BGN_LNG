  storage.nl.injection_gwhd:     {<<: *agsi, ticker: "CGIENLIN Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: NL, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.IN; PHASE1_NOTES storage gate"}
  storage.nl.withdrawal_gwhd:    {<<: *agsi, ticker: "CGIENLWI Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: NL, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WI; PHASE1_NOTES storage gate"}
