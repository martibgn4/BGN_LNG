  storage.cz.withdrawal_gwhd:    {<<: *agsi, ticker: "CGIECZWI Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: CZ, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WI; PHASE1_NOTES storage gate"}
  storage.cz.working_gas_volume_twh: {<<: *agsi, ticker: "CGIECZWG Index", unit: TWh, description_unit: TWh, measure_type: capacity, geography: CZ, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WG; PHASE1_NOTES storage gate"}
  storage.gb.inventory_twh:      {<<: *agsi, ticker: "CGIEGBST Index", unit: TWh,   description_unit: TWh,   measure_type: stock,    geography: GB, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.ST (country_code_map UK->GB); PHASE1_NOTES storage gate"}
  storage.gb.injection_gwhd:     {<<: *agsi, ticker: "CGIEGBIN Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: GB, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.IN (UK->GB); PHASE1_NOTES storage gate"}
