  # -------------------------------------------------------------------------- LNG terminals (ALSI)
  # Owned here because the brief assigns LNGATL* to fundamentals; the lng-flows agent must NOT also
  # declare these ids in bloomberg_lng.yaml (the Bloomberg adapter merges all bloomberg*.yaml files).
  lng.eu.sendout_gwhd:
    <<: *agsi
    ticker: "LNGATLSO Index"
    unit: GWh/d
    description_unit: GWh/d
    measure_type: flow
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml lng_series.europe_lng_sendout (identified, not pulled in sibling Phase 1)"
  lng.eu.terminal_inventory_1000m3:
    # Bloomberg: "Europe LNG Inventory (Daily,1000 m3,GIE)". The sibling labels this `km3`, which
    # reads as cubic KILOMETRES (1e9 m3) - wrong by 10^6. Kept as "1000m3". Whether this is LIQUID
    # LNG volume (ALSI convention, ~600x gas volume) or gas volume is unresolved: never convert it
    # with units.GasQuality (a gas-phase GCV) until settled.
    <<: *agsi
    ticker: "LNGATLIN Index"
    unit: "1000m3"
    description_unit: "1000 m3"
    measure_type: stock
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml lng_series.europe_lng_inventory (identified, not pulled in sibling Phase 1)"
  lng.eu.sendout_capacity_gwhd:
    # ALSI publishes declared/technical send-out capacity (DTRS); no Bloomberg identifier known.
    <<: *agsi
    ticker: null
    status: requires_discovery
    unit: GWh/d
    description_unit: null
    measure_type: capacity
    geography: EU
    provenance: "none"

  # --------------------------------------------------------------- TSO demand (country components)
  # NOT an EU total: these cover parts of FR/BE/NL/AT/UK only (Germany has no daily demand series on
  # Bloomberg - ../GasImbalanceModel/config/demand_sources.yaml `gaps.DE_demand`). Useful for
  # country-level checks and as weather-sensitive demand proxies; never summed into an "EU demand".
  demand.fr.total_gwhd:          {<<: *tso_demand, ticker: "FRGCALTL Index", unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.fr.ldz_gwhd:            {<<: *tso_demand, ticker: "FRGCSDPD Index", unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.fr.industry_hms_gwhd:   {<<: *tso_demand, ticker: "FRGCNDCC Index", unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.fr.industry_nonhms_gwhd: {<<: *tso_demand, ticker: "FRGCADIC Index", unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.fr.terega_pitd_gwhd:    {<<: *tso_demand, ticker: "TFGDPITD Index", unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.fr.terega_pic_gwhd:     {<<: *tso_demand, ticker: "TFGDPIC Index",  unit: GWh/d, description_unit: GWh/d, geography: FR, sign: 1}
  demand.be.ldz_mcmd:            {<<: *tso_demand, ticker: "FXMDEFHD Index", unit: mcm/d, description_unit: mcm/d, geography: BE, sign: -1}
  demand.be.industry_mcmd:       {<<: *tso_demand, ticker: "FXMCHPIC Index", unit: mcm/d, description_unit: mcm/d, geography: BE, sign: -1}
  demand.be.power_mcmd:          {<<: *tso_demand, ticker: "FXMPHPPP Index", unit: mcm/d, description_unit: mcm/d, geography: BE, sign: -1}
  demand.nl.industry_h_mcmd:     {<<: *tso_demand, ticker: "NLGDMINH Index", unit: mcm/d, description_unit: mcm/d, geography: NL, sign: 1}
  demand.nl.industry_l_mcmd:     {<<: *tso_demand, ticker: "NLGDMINL Index", unit: mcm/d, description_unit: mcm/d, geography: NL, sign: 1}
  demand.at.area_east_mcmd:      {<<: *tso_demand, ticker: "AGGMEDEM Index", unit: mcm/d, description_unit: mcm/d, geography: AT, sign: 1}
  demand.at.area_tyrol_mcmd:     {<<: *tso_demand, ticker: "AGGMTDEM Index", unit: mcm/d, description_unit: mcm/d, geography: AT, sign: 1}
  demand.at.area_vorarlberg_mcmd: {<<: *tso_demand, ticker: "AGGMVDEM Index", unit: mcm/d, description_unit: mcm/d, geography: AT, sign: 1}
  demand.gb.ldz_eastern_mcmd:    {<<: *tso_demand, ticker: "NLDZEA1D Index", unit: mcm/d, description_unit: mcm/d, geography: GB, sign: 1}

