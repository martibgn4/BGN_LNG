# Bloomberg-sourced European gas fundamentals (GIE AGSI+/ALSI redistribution, TSO demand).
# Served live by data/bloomberg.py (the Bloomberg adapter reads every configs/sources/bloomberg*.yaml)
# and routed there by data/fundamentals.py. Owner: gas-fundamentals-agent.
#
# PROVENANCE. No identifier here was guessed. Every `known` ticker is copied from a sibling project
# that discovered it with Bloomberg's own //blp/instruments search on 2026-08-25 and verified it by
# pulling real data and checking magnitudes:
#   ../GasImbalanceModel/config/bloomberg_series.yaml   (CGIE storage, LNGATLIN, LNGATLSO)
#   ../GasImbalanceModel/config/demand_sources.yaml     (TSO demand series)
#   ../GasImbalanceModel/PHASE1_NOTES.md                (storage identity reconciles over 3 gas years)
# The field `px_last` is the field the sibling fetcher uses for every one of these series
# (../GasImbalanceModel/src/gasbalance/data/bloomberg.py, PRICE_FIELD). These identifiers have NOT
# been re-verified in this project (docs/environment_audit.md).
#
# UNITS come from the Bloomberg security descriptions as recorded in the sibling, e.g.
#   "Germany Gas Inventory (Daily,TWh,GIE)", "Germany Gas Withdrawal (Daily,GWh/d,GIE)",
#   "Europe LNG Inventory (Daily,1000 m3,GIE)", "Europe LNG Send-Out (Daily,GWh/d,GIE)".
# All AGSI/ALSI energies are on a GCV basis. A live fetch should compare `description_unit` with
# the Bloomberg NAME/description and raise on disagreement (sibling behaviour).
#
# PUBLICATION LAG (docs/point_in_time_policy.md §4): GIE publishes gas day D at D+1 19:30 CET and
# revises later; Bloomberg history holds only the latest value, so availability is set to the
# conservative D+2 07:00 Europe/Amsterdam and pit_grade = B. Sensitivity runs: +1 and +3 days.
# The TSO demand series have NO documented lag rule: the same D+2 07:00 is ASSUMED (flagged with
# publication_lag_evidence: none) and must be measured by live snapshotting before trusting them.
#
# Extension keys beyond the shared schema in configs/data_sources.yaml (consumers may ignore them):
#   description_unit  unit text as given in the Bloomberg description
#   measure_type      stock | flow | capacity | ratio
#   sign              +1 or -1: multiply the vendor value by this to get the positive physical
#                     quantity named by the series id (Fluxys publishes demand as negative offtake).
#                     Applied ONCE, in data/fundamentals.py, never in data/bloomberg.py.
#   publication_lag_evidence   documented | none

x-defaults:
  agsi: &agsi
    vendor: bloomberg
    field: px_last
    frequency: daily
    status: known
    pit_grade: B
    publication_lag: {days: 2, time: "07:00", tz: "Europe/Amsterdam", business_days: false}
    publication_lag_evidence: documented
    publication_lag_sensitivity_days: [1, 3]
    entitlement: licensed_bloomberg
    revision_behaviour: "GIE revises after first release; Bloomberg keeps latest value only (no vintages)"
    sign: 1
  tso_demand: &tso_demand
    vendor: bloomberg
    field: px_last
    frequency: daily
    status: known
    pit_grade: B
    publication_lag: {days: 2, time: "07:00", tz: "Europe/Amsterdam", business_days: false}
    publication_lag_evidence: none
    entitlement: licensed_bloomberg
    measure_type: flow
    revision_behaviour: "unknown; TSO allocations are typically restated - measure before use"
    provenance: "../GasImbalanceModel/config/demand_sources.yaml, discovered+verified 2026-08-25"

series:
  # ------------------------------------------------------------------ EU aggregate storage (AGSI)
  # Perimeter of GIE's "EU" aggregate (EU27, UK excluded post-Brexit?) must be read from the
  # Bloomberg description before live use - recorded as an unresolved question, not assumed.
  storage.eu.inventory_twh:
    <<: *agsi
    ticker: "CGIEEUST Index"
    unit: TWh
    description_unit: TWh
    measure_type: stock
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml aggregate.europe_inventory; 2025-01-15 = 690.99 TWh"
  storage.eu.injection_gwhd:
    <<: *agsi
    ticker: "CGIEEUIN Index"
    unit: GWh/d
    description_unit: GWh/d
    measure_type: flow
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml aggregate.europe_injection"
  storage.eu.withdrawal_gwhd:
    <<: *agsi
    ticker: "CGIEEUWI Index"
    unit: GWh/d
    description_unit: GWh/d
    measure_type: flow
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml aggregate.europe_withdrawal; 2025-01-15 = 8810 GWh/d"
  storage.eu.working_gas_volume_twh:
    <<: *agsi
    ticker: "CGIEEUWG Index"
    unit: TWh
    description_unit: "TWh (Technical Capacity)"
    measure_type: capacity
    geography: EU
    provenance: "../GasImbalanceModel/config/bloomberg_series.yaml aggregate.europe_capacity; 2025-01-15 = 1147.64 TWh"
  storage.eu.full_pct:
    # The orchestrator brief names an `FU` suffix in the CGIE family, but no in-repo file verifies
    # any FU ticker. Not needed: % full is derived as inventory / working gas volume.
    <<: *agsi
    ticker: null
    status: requires_discovery
    unit: "%"
    description_unit: null
    measure_type: ratio
    geography: EU
    provenance: "none - FU suffix unverified; derive from storage.eu.inventory_twh / storage.eu.working_gas_volume_twh"
  storage.eu.injection_capacity_gwhd:
    # AGSI publishes injection capacity per site; no Bloomberg CGIE suffix for it is known.
    <<: *agsi
    ticker: null
    status: requires_discovery
    unit: GWh/d
    description_unit: null
    measure_type: capacity
    geography: EU
    provenance: "none - AGSI field exists, Bloomberg identifier unknown"
  storage.eu.withdrawal_capacity_gwhd:
    <<: *agsi
    ticker: null
    status: requires_discovery
    unit: GWh/d
    description_unit: null
    measure_type: capacity
    geography: EU
    provenance: "none - AGSI field exists, Bloomberg identifier unknown"

