  storage.be.withdrawal_gwhd:    {<<: *agsi, ticker: "CGIEBEWI Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: BE, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WI; PHASE1_NOTES storage gate"}
  storage.be.working_gas_volume_twh: {<<: *agsi, ticker: "CGIEBEWG Index", unit: TWh, description_unit: TWh, measure_type: capacity, geography: BE, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WG; PHASE1_NOTES storage gate"}
  storage.fr.inventory_twh:      {<<: *agsi, ticker: "CGIEFRST Index", unit: TWh,   description_unit: TWh,   measure_type: stock,    geography: FR, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.ST; PHASE1_NOTES storage gate"}
