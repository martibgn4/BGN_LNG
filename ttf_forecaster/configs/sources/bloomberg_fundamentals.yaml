  storage.dk.injection_gwhd:     {<<: *agsi, ticker: "CGIEDKIN Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: DK, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.IN; PHASE1_NOTES storage gate"}
  storage.dk.withdrawal_gwhd:    {<<: *agsi, ticker: "CGIEDKWI Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: DK, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WI; PHASE1_NOTES storage gate"}
