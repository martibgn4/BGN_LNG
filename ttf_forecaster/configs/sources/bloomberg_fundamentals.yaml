    pit_grade: B
    publication_lag: {days: 1, time: "12:00", tz: "Europe/Amsterdam", business_days: false}
    publication_lag_evidence: none
    entitlement: licensed_bloomberg
    provenance: "Bloomberg discovery 2026-10-19: 'Norway to Others Daily Historical Flows/Within-Day Nominations (Gassco)'; live, PX_LAST 1.4 on 2026-10-18"
    note: "Small residual route. No Bloomberg series gives the Benelux/France split of the Gassco total; do not derive one by subtraction without a stated assumption"
  flow.de.dornum_entry_gwhd:
