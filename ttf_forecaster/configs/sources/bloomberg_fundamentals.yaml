  storage.fr.working_gas_volume_twh: {<<: *agsi, ticker: "CGIEFRWG Index", unit: TWh, description_unit: TWh, measure_type: capacity, geography: FR, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WG; PHASE1_NOTES storage gate"}
  storage.at.inventory_twh:      {<<: *agsi, ticker: "CGIEATST Index", unit: TWh,   description_unit: TWh,   measure_type: stock,    geography: AT, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.ST; PHASE1_NOTES storage gate"}
  storage.at.injection_gwhd:     {<<: *agsi, ticker: "CGIEATIN Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: AT, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.IN; PHASE1_NOTES storage gate"}
  storage.at.withdrawal_gwhd:    {<<: *agsi, ticker: "CGIEATWI Index", unit: GWh/d, description_unit: GWh/d, measure_type: flow,     geography: AT, provenance: "../GasImbalanceModel/config/bloomberg_series.yaml storage_series.WI; PHASE1_NOTES storage gate"}
