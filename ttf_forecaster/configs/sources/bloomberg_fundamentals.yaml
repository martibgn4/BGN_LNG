  # PIT: B grade throughout (Bloomberg keeps the latest value only, no vintages). Daily flows and
  # production: D+1 12:00 Europe/Amsterdam (ASSUMPTION, conservative). Monthly production: 45 days.
  # ===================================================================================================
  flow.no.exit_total_mcmd:
    vendor: bloomberg
    ticker: "GAANTOTL Index"
    field: px_last
    unit: MCM/d
    description_unit: MCM/d
    frequency: daily
    geography: NO
    measure_type: flow
    status: known
    pit_grade: B
    publication_lag: {days: 1, time: "12:00", tz: "Europe/Amsterdam", business_days: false}
    publication_lag_evidence: none
    entitlement: licensed_bloomberg
    provenance: "Bloomberg discovery 2026-10-19: 'Norway Total Exit Daily Within-Day Nominations (Gassco)(MCM/d)'; live, PX_LAST 341.0 on 2026-10-18, QUOTE_UNITS MCM/d"
    note: "Within-day nominations, not final allocations. Revision behaviour unknown."
