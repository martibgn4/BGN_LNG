# Bloomberg weather through BQL weather(), read via the user's Excel (D-042, 2026-10-19).
# NOT served by the Bloomberg ticker adapter: these entries have no ticker (ticker: null), so is_known is False and
# LiveBloombergAdapter refuses them. They are filled by pipelines/bql_weather.py through data/bql_excel.py.
# Forecast series: one row per (as_of, lead) per model in the 'model' and 'member' columns of FORECAST_SCHEMA.
# Units are the BQL convention and are ASSUMED until checked on the Terminal (WIND_SPEED m/s, SOLAR_RADIATION W/m2).
# Solar radiation is not returned for actuals or normals.

