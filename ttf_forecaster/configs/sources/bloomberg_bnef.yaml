# BloombergNEF European Power Market Monitor (user-supplied workbook, 2026-10-19), registered on Bloomberg
# tickers. Owner: orchestrator. Source file: ttf_forecaster/data/raw/extracts/bnef (git-ignored); this file
# holds identifiers and provenance only. Every entry was reference-checked on 2026-10-19 (NAME, PX_LAST,
# LAST_UPDATE_DT): status known only where PX_LAST is present and LAST_UPDATE_DT >= 2025-01-01.
#
# NOT registered here (see docs/bloomberg_discovery.md, BNEF section):
#   * interconnector flows (257 tickers): deferred by request;
#   * spark and dark spreads, carbon and coal "Calculated field" rows: no Bloomberg ticker, derived in
#     BNEF's own workbook. Build them from registered prices if needed;
#   * ids already registered elsewhere (power.de.gen_solar_mw = GT1CDESL, power.de.gen_wind_on_mw =
#     GT1CDEWS, power.de.load_act_mw = LD1CDE, all in bloomberg_power.yaml): reused, not duplicated;
#   * dead tickers (last update before 2025): GT1CBECO (Belgium coal) and GT1CDENU (Germany nuclear).
#
# DE day-ahead (D-041): price.power_de.da_eur_mwh now points at LPXBHRBS (EPEX DE/AT day-ahead baseload
# index, history from 2001). ELGBDAHD moved to price.power_de.da_otc_elgb_eur_mwh (history from 2011-02).
#
# PIT: exchange auction prices grade A, published the day before delivery; the lag used (delivery day
# 19:00) is conservative. Generation, load and flows grade B (TSO and vendor revisions), available D+1 12:00.
# Capacity grade B, D+7 12:00 (cumulative capacity updates are irregular).

