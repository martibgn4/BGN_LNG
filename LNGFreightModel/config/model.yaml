# ---------------------------------------------------------------------------
# model.yaml - estimators, and the walk-forward protocol they are judged by.
#
# No float literal appears in the .py files; every number a model depends on
# is here, so a result can be reproduced from a config diff alone.
# ---------------------------------------------------------------------------

benchmarks:
  # 1. Random walk: predict zero log change. For a spot assessment this is the
  #    honest null and it is genuinely hard to beat at h=1.
  random_walk: {enabled: true}

  # 2. FFA forward: the M+0/M+1 curve implies where the market thinks spot is
  #    going. This is the benchmark that matters commercially, because it is
  #    the price the desk could lock instead of trusting the model.
  ffa_forward: {enabled: true, tenor_for_short_h: "M+0", tenor_for_long_h: "M+1"}

  # 3. Own-lags autoregression: the SAME estimator, fitted on the freight
  #    family alone (its own past returns, vol and z-scores) with every
  #    fundamental feature withheld.
  #
  #    This is the benchmark that matters most here, and it exists because of
  #    a measurement made before any model was fitted: the daily log change of
  #    the Spark30S assessment has AR(1) = +0.46. That is assessment
  #    smoothing - a reporting agency walks its published number toward the
  #    market over several days rather than jumping - and it makes the series
  #    look far more forecastable than the market it describes.
  #
  #    Against a random walk, any model with access to lagged freight will
  #    therefore post a large, real and almost entirely uninteresting skill.
  #    The only question worth asking is whether the arb, on-water and routing
  #    features add anything ON TOP of that, so this benchmark is the one the
  #    headline result is quoted against.
  own_lags: {enabled: true, families: ["frt"]}

  # 4. Seasonal-naive is deliberately NOT included. At a 1-15 day horizon the
  #    seasonal term moves by almost nothing, so it would be a random walk
  #    wearing a different label and would flatter the comparison table.

estimators:

  ridge:
    # Linear, standardised, heavily regularised. The interpretable workhorse:
    # with ~1000 observations and ~90 columns, an unregularised fit would be
    # reading noise. Alpha is chosen inside each training window by time-series
    # CV, never on the test block.
    enabled: true
    alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
    cv_splits: 5
    standardise: true

  huber:
    # DISABLED, and the reason is a diagnosis rather than a bad number.
    #
    # It was included as a robustness check: freight returns have genuine fat
    # tails, and a robust loss would show whether the linear result depends on
    # them. At 134 features it scored -0.4 to -0.6 skill, which was written off
    # as a loss-function mismatch (it optimises a robust loss while being
    # graded on RMSE). At 206 features it fell to -1.0 / -2.0, which is not a
    # mismatch, it is a failure.
    #
    # Measured at h=15, 450 training rows, 206 features:
    #
    #   alpha    train RMSE   test RMSE
    #   0.001      0.0474       1.0654
    #   1.0        0.0512       0.9891
    #   100.0      0.0937       0.6605
    #   predicting zero            0.3245
    #
    # A 22x train-test gap: it is interpolating 206 columns through 450 rows.
    # sklearn's HuberRegressor takes a single fixed `alpha` with no CV path,
    # unlike RidgeCV which searches to 10,000, so it is effectively
    # unregularised at this dimensionality. Even at alpha=100 it is twice as
    # bad as predicting no change.
    #
    # Tuning alpha until it looks acceptable would mean choosing a
    # hyperparameter by looking at the test block, which is the thing this
    # whole project is set up to avoid. The robustness role it was meant to
    # play is served properly by family_pca_ridge below, which reduces the
    # dimensionality first and is cross-validated. Re-enable only with a
    # CV'd regularisation path.
    enabled: false
    epsilon: 1.35
    alpha: 0.001
    max_iter: 5000

  lightgbm:
    # Non-linear, for the interaction the arb story predicts: afloat volume
    # should mean opposite things depending on the sign of the arb. Kept
    # small because the sample is small.
    enabled: true
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 7
    max_depth: 3
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.6
    reg_lambda: 10.0
    verbosity: -1

  family_pca_ridge:
    # Ridge on FAMILY SCORES rather than on raw columns.
    #
    # This is the sibling StockPicker's fix #1, applied here for the same
    # reason and decided on methodological grounds rather than by looking at
    # the answer. The feature set is 206 columns against ~600 observations,
    # and most of those columns are one idea expressed at several windows:
    # `tm__avg_haul_nm` at 21 and 63 days, z-scored and differenced four ways,
    # is a single economic quantity getting eight votes. Feeding them raw
    # dilutes whatever signal exists, which is visibly what happens - the
    # full-feature ridge scores WORSE than the same ridge on freight's own
    # lags alone.
    #
    # So each fundamental family is compressed to its leading principal
    # components, fitted inside the training window only, and the ridge sees
    # those. The freight family passes through raw: it is the benchmark's own
    # information set, and compressing it would change what is being compared.
    enabled: true
    components_per_family: 2
    passthrough_families: ["frt", "sea"]

walk_forward:
  # Expanding window, refit periodically. Expanding rather than rolling for
  # the reason StockPicker found: at this signal-to-noise a one-year window
  # estimates weights that are mostly noise.
  scheme: "expanding"
  min_train_bd: 378          # 18 months before the first prediction is made
  refit_every_bd: 21         # monthly refit; daily refit is cost without benefit

  # PURGE. With an h-day horizon, target windows overlap: the label for origin
  # t is not known until t+h, so any training row within h days of the test
  # origin has seen part of the test label. Those rows are dropped.
  purge_bd: "horizon"        # literally h, resolved per horizon

  # EMBARGO. Extra days dropped after the test block before training resumes,
  # to stop a slow-moving feature carrying test-period information back.
  embargo_bd: 5

evaluation:
  # Skill = 1 - RMSE_model / RMSE_benchmark. Positive means the model won.
  primary_metric: "rmse_skill_vs_random_walk"
  secondary_metric: "rmse_skill_vs_ffa_forward"
  report:
    - rmse
    - mae
    - hit_rate               # sign accuracy of the predicted change
    - information_coefficient  # Spearman, prediction vs realised
    - n_observations         # differs per horizon - see target.yaml staleness

  # Diebold-Mariano, HAC-corrected. With overlapping h-day targets the naive
  # t-stat on a difference of squared errors is badly oversized; Newey-West
  # with h-1 lags is the minimum honest correction.
  significance:
    test: "diebold_mariano"
    hac_lags: "horizon_minus_one"
    alpha: 0.05

  # A hit rate below 50% is reported as it lands. It is NOT sign-flipped into
  # a winning strategy - the sibling NWE model records exactly that temptation
  # and refuses it, because an inverted backtest is an artefact, not an edge.
  never_sign_flip: true
